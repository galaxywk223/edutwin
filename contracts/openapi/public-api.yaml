          description: Student assessments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentList'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/lms/assessments/{assessmentId}:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [Student LMS]
      operationId: getPublishedAssessment
      summary: Return published objective questions without answer keys
      responses:
        '200':
          description: Assessment detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentDetail'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/lms/assessments/{assessmentId}/submissions:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [Student LMS]
      operationId: getOwnAssessmentSubmission
      summary: Return the current student's unique assessment submission
      responses:
        '200': { description: Student submission., content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentResult' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Student LMS]
      operationId: submitAssessment
      summary: Submit one immutable objective assessment attempt
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentSubmissionRequest'
      responses:
        '201':
          description: Assessment scored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/lms/assessments/{assessmentId}/attempts:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [Student LMS]
      operationId: listOwnAssessmentAttempts
      summary: List all immutable attempts and the current grade-bearing submission
      responses:
        '200': { description: Assessment attempts., content: { application/json: { schema: { $ref: '#/components/schemas/AssessmentAttemptList' } } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/lms/assessments/{assessmentId}/attempt-requests:
    parameters:
      - $ref: '#/components/parameters/AssessmentId'
    get:
      tags: [Student LMS]
      operationId: listOwnAssessmentAttemptRequests
      summary: List the current student's requests and teacher decisions
      responses:
        '200': { description: Own attempt requests., content: { application/json: { schema: { $ref: '#/components/schemas/AttemptRequestList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Student LMS]
      operationId: createOwnAssessmentAttemptRequest
      summary: Request a makeup, retake, or appeal attempt
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AttemptRequestCreate' } } }
      responses:
        '201': { description: Attempt request created., content: { application/json: { schema: { $ref: '#/components/schemas/AttemptRequest' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/lms/courses/{courseId}/grades:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Student LMS]
      operationId: getStudentGrades
      summary: Return the current student's assessment results
      responses:
        '200':
          description: Student grade list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeList'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Stateless JWT containing one role plus userId and authorization-version claims; logout discards the token client-side.
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    StudentId:
      name: studentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionId:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LessonId:
      name: lessonId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Key scoped to the authenticated user and answer endpoint.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    LastEventId:
      name: Last-Event-ID
      in: header
      required: false
      schema:
        type: string
        pattern: '^[0-9]+$'
    BeforeVersion:
      name: beforeVersion
      in: query
      required: false
      description: Exclusive upper snapshot version bound.
      schema:
        type: integer
        format: int64
        minimum: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    AnalyticsPeriod:
      name: period
      in: query
      required: false
      schema:
        type: string
        enum: [7D, 30D, TERM]
        default: 30D
  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Authenticated principal lacks the required role or scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Resource not found within the authorized scope.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Idempotency conflict, stale snapshot, or immutable-version conflict.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Request is syntactically valid but violates a domain invariant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TooManyRequests:
      description: Authentication rate limit exceeded.
      headers:
        Retry-After:
          required: true
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 128
        password:
          type: string
          minLength: 8
          maxLength: 256
          writeOnly: true
    AuthSession:
      type: object
      additionalProperties: false
      required: [accessToken, tokenType, expiresAt, user]
      properties:
        accessToken:
          type: string
          minLength: 1
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/AuthenticatedUser'
    AuthenticatedUser:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, role, activeRole, availableRoles, mustChangePassword, accessibleCourseIds]
      properties:
        userId:
          type: string
          format: uuid
        username:
          type: string
          minLength: 1
        displayName:
          type: string
          minLength: 1
        role:
          $ref: '#/components/schemas/UserRole'
        activeRole:
          $ref: '#/components/schemas/UserRole'
        availableRoles:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '#/components/schemas/UserRole' }
        mustChangePassword:
          type: boolean
        accessibleCourseIds:
          type: array
          uniqueItems: true
          items:
            type: string
            format: uuid
    UserRole:
      type: string
      enum: [ADMIN, TEACHER, STUDENT, COUNSELOR]
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, minLength: 1 }
        newPassword: { type: string, minLength: 12 }
    UserProfile:
      type: object
      additionalProperties: false
      required: [userId, username, displayName, roles, organizations]
      properties:
        userId: { type: string, format: uuid }
        username: { type: string }
        displayName: { type: string }
        officialId: { type: [string, 'null'] }
        roles: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/UserRole' } }
        organizations:
          type: array
          items:
            type: object
            required: [organizationId, code, displayName, unitType]
            properties:
              organizationId: { type: string, format: uuid }
              code: { type: string }
              displayName: { type: string }
              unitType: { type: string, enum: [COLLEGE, DEPARTMENT, MAJOR, CLASS] }
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'] }
        avatarKey: { type: [string, 'null'], enum: [avatar-1, avatar-2, avatar-3, avatar-4, avatar-5, avatar-6, avatar-7, avatar-8, null] }
        themeColor: { type: [string, 'null'], enum: [teal, blue, green, amber, red, gray, violet, rose, null] }
    UserProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        email: { type: [string, 'null'], format: email }
        phone: { type: [string, 'null'], maxLength: 40 }
        avatarKey: { type: [string, 'null'], enum: [avatar-1, avatar-2, avatar-3, avatar-4, avatar-5, avatar-6, avatar-7, avatar-8, null] }
        themeColor: { type: [string, 'null'], enum: [teal, blue, green, amber, red, gray, violet, rose, null] }
    NotificationPage:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [notificationId, type, title, body, createdAt, read]
            properties:
              notificationId: { type: string, format: uuid }
              type: { type: string }
              title: { type: string }
              body: { type: string }
              deepLink: { type: [string, 'null'] }
              createdAt: { type: string, format: date-time }
              expiresAt: { type: [string, 'null'], format: date-time }
              read: { type: boolean }
        page: { type: integer, minimum: 0 }
        size: { type: integer, minimum: 1 }
        total: { type: integer, format: int64, minimum: 0 }
    AssistantConversation:
      type: object
      additionalProperties: false
      required: [conversationId, title, activeRole, createdAt, updatedAt]
      properties:
        conversationId: { type: string, format: uuid }
        title: { type: string }
        activeRole: { $ref: '#/components/schemas/UserRole' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    AssistantConversationList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AssistantConversation' } }
    AssistantSource:
      type: object
      required: [label, queriedAt, deepLink]
      properties:
        label: { type: string }
        queriedAt: { type: string, format: date-time }
        deepLink: { type: string }
    AssistantMessage:
      type: object
      required: [messageId, role, status, sources, deepLinks, retryable, createdAt]
      properties:
        messageId: { type: string, format: uuid }
        role: { type: string, enum: [USER, ASSISTANT] }
        status: { type: string, enum: [COMPLETED, PROCESSING, FAILED] }
        content: { type: [string, 'null'] }
        sources: { type: array, items: { $ref: '#/components/schemas/AssistantSource' } }
        deepLinks: { type: array, items: { type: string } }
        errorCode: { type: [string, 'null'] }
        retryable: { type: boolean }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
    AssistantMessageList:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AssistantMessage' } }
    AssistantSendRequest:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 4000 }
        clientMessageId: { type: string, format: uuid }
        routeContext:
          type: object
          additionalProperties: { type: string, maxLength: 500 }
    AssistantMessageReceipt:
      type: object
      required: [userMessageId, assistantMessageId, status, streamUrl]
      properties:
        userMessageId: { type: string, format: uuid }
        assistantMessageId: { type: string, format: uuid }
        status: { type: string }
        streamUrl: { type: string }
    AssistantEvent:
      type: object
      required: [sequence, messageId, type, occurredAt, data]
      properties:
        sequence: { type: integer, format: int64, minimum: 1 }
        messageId: { type: string, format: uuid }
        type:
          type: string
          enum: [message.started, tool.started, tool.completed, message.delta, message.completed, message.failed]
        occurredAt: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    CourseList:
      type: object
      additionalProperties: false
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CourseSummary'
        total:
          type: integer
          minimum: 0
    CourseSummary:
      type: object
      additionalProperties: false
      required: [courseId, code, name, credits, role]
      properties:
        courseId:
          type: string
          format: uuid
        code:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        termLabel:
          type: [string, 'null']
          maxLength: 80
        college: { type: [string, 'null'] }
        department: { type: [string, 'null'] }
        credits: { type: number, format: double, minimum: 0.5, maximum: 20 }
        instructorName: { type: [string, 'null'] }
        role:
          $ref: '#/components/schemas/UserRole'
    DataVersionRef:
      type: object
      additionalProperties: false
      required: [sourceId, version, manifestSha256]
      properties:
        sourceId:
          type: string
          enum: [ASSISTMENTS_2009_2010_SKILL_BUILDER_CORRECTED, OULAD, EDUTWIN_DEMO]
        version:
          type: string
          minLength: 1
        manifestSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    ModelVersionRef:
      type: object
      additionalProperties: false
      required: [purpose, family, modelName, modelVersion, artifactSha256, calibratorVersion]
      properties:
        purpose:
          type: string
          enum: [MASTERY, NEXT_CORRECT, RISK, EXPLANATION, DIAGNOSIS, PLAN_RULES]
        family:
          type: string
          enum: [IRT, BKT, DKT, AKT, LOGISTIC_REGRESSION, LIGHTGBM, CATBOOST, SHAP, DEEPSEEK, OPENAI_COMPATIBLE, RULE, TEMPLATE]
        modelName:
          type: string
          minLength: 1
        modelVersion:
          type: string
          minLength: 1
        artifactSha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        calibratorVersion:
          type: [string, 'null']
          minLength: 1
    TraceRef:
      type: object
      additionalProperties: false
      required:
        - correlationId
        - answerEventId
        - analysisJobId
        - snapshotId
        - dataVersions
        - requestedModelVersions
        - effectiveModelVersions
      properties:
        correlationId:
          type: string
          format: uuid
        answerEventId:
          type: string
          format: uuid
        analysisJobId:
          type: string
          format: uuid
        snapshotId:
          type: string
          format: uuid
          description: Preallocated for QUEUED jobs and persisted unchanged on completion.
        dataVersions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DataVersionRef'
        requestedModelVersions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelVersionRef'
        effectiveModelVersions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ModelVersionRef'
    RiskPrediction:
      type: object
      additionalProperties: false
      required:
        - probability
        - riskBand
        - mediumThreshold
        - highThreshold
        - predictedAt
      properties:
        trace:
          $ref: '#/components/schemas/TraceRef'
          x-edutwin-visibility: internal
        probability:
          type: number
          minimum: 0
          maximum: 1
        calibrated:
          type: boolean
          x-edutwin-visibility: internal
        riskBand:
          $ref: '#/components/schemas/RiskBand'
        mediumThreshold:
          type: number
          minimum: 0
          maximum: 1
        highThreshold:
          type: number
          minimum: 0
          maximum: 1
        baseValue:
          type: number
          description: Selected risk model base value in log-odds space.
          x-edutwin-visibility: internal
        featureContractVersion:
          type: string
          minLength: 1
          x-edutwin-visibility: internal
        predictedAt:
          type: string
          format: date-time
        degraded:
          type: boolean
          x-edutwin-visibility: internal
    RiskBand:
      type: string
      enum: [LOW, MEDIUM, HIGH]
    SkillMastery:
      type: object
      additionalProperties: false
      required: [skillId, skillName, probability]
      properties:
        skillId:
          type: string
          format: uuid
        skillName:
          type: string
          minLength: 1
        probability:
          type: number
          minimum: 0
          maximum: 1
        estimator:
          type: string
          enum: [BKT, RULE_FALLBACK]
          x-edutwin-visibility: internal
    TwinState:
      type: object
      additionalProperties: false
      required:
        - studentId
        - courseId
        - snapshotVersion
        - capturedAt
        - mastery
        - engagementScore
        - stabilityScore
        - nextCorrectProbability
        - risk
        - planCompletionRate
      properties:
        trace:
          $ref: '#/components/schemas/TraceRef'
          x-edutwin-visibility: internal
        studentId:
          type: string
          format: uuid
        courseId:
          type: string
          format: uuid
        snapshotVersion:
          type: integer
          format: int64
          minimum: 1
        capturedAt:
          type: string
          format: date-time
        mastery:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SkillMastery'
        engagementScore:
          type: number
          minimum: 0
          maximum: 1
        stabilityScore:
          type: number
          minimum: 0
          maximum: 1
        nextCorrectProbability:
          type: number
          minimum: 0
          maximum: 1
        risk:
          $ref: '#/components/schemas/RiskPrediction'
        planCompletionRate:
          type: number
          minimum: 0
          maximum: 1
        degraded:
          type: boolean
          x-edutwin-visibility: internal
        degradationReasons:
          type: array
          uniqueItems: true
          x-edutwin-visibility: internal
          items:
            type: string
            enum: [KNOWLEDGE_MODEL_UNAVAILABLE, RISK_MODEL_UNAVAILABLE, MODEL_TIMEOUT, MODEL_CONTRACT_ERROR]
    TwinHistory:
      type: object
      additionalProperties: false
      required: [items, total, nextBeforeVersion]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TwinState'
        total:
          type: integer
          minimum: 0
        nextBeforeVersion:
          type: [integer, 'null']
          format: int64
          minimum: 1
    WeakSkill:
      type: object
      additionalProperties: false
      required: [skillId, skillName, averageMastery, affectedStudentCount]
      properties:
        skillId:
          type: string
          format: uuid
        skillName:
          type: string
          minLength: 1
        averageMastery:
          type: number
          minimum: 0
          maximum: 1
        affectedStudentCount:
          type: integer
          minimum: 0
    ActivityPoint:
      type: object
      additionalProperties: false
      required: [date, answerCount, activeStudentCount, correctRate]
      properties:
        date:
          type: string
          format: date
        answerCount:
          type: integer
          minimum: 0
        activeStudentCount:
          type: integer
          minimum: 0
        correctRate:
          type: number
          minimum: 0
          maximum: 1
    BehaviorDistributionItem:
      type: object
      additionalProperties: false
      required: [behaviorType, eventCount, studentCount, share]
      properties:
        behaviorType: { type: string }
        eventCount: { type: integer, minimum: 0 }
        studentCount: { type: integer, minimum: 0 }
        share: { type: number, minimum: 0, maximum: 1 }
    ActivityHeatmapPoint:
      type: object
      additionalProperties: false
      required: [weekday, hour, eventCount]
      properties:
        weekday: { type: integer, minimum: 1, maximum: 7 }
        hour: { type: integer, minimum: 0, maximum: 23 }
        eventCount: { type: integer, minimum: 0 }
    StudentScatterPoint:
      type: object
      additionalProperties: false
      required: [studentId, displayName, averageMastery, riskProbability, engagementScore, behaviorProfile]
      properties:
        studentId: { type: string, format: uuid }
        displayName: { type: string }
        averageMastery: { type: number, minimum: 0, maximum: 1 }
        riskProbability: { type: number, minimum: 0, maximum: 1 }
        engagementScore: { type: number, minimum: 0, maximum: 1 }
        behaviorProfile: { type: string }
    StudentRiskSummary:
      type: object
      additionalProperties: false
      required: [studentId, displayName, riskProbability, riskBand, lastActivityAt, averageMastery, engagementScore, answerCount, behaviorProfile]
      properties:
        studentId:
          type: string
          format: uuid
        displayName:
          type: string
          minLength: 1
        snapshotId:
          type: string
          format: uuid
          x-edutwin-visibility: internal
        riskProbability:
          type: number
          minimum: 0
          maximum: 1
        riskBand:
          $ref: '#/components/schemas/RiskBand'
        lastActivityAt:
          type: string
          format: date-time
        averageMastery: { type: number, minimum: 0, maximum: 1 }
        engagementScore: { type: number, minimum: 0, maximum: 1 }
        answerCount: { type: integer, minimum: 0 }
        behaviorProfile: { type: string }
    TeacherDashboard:
      type: object
      additionalProperties: false
      required:
        - courseId
        - generatedAt
        - studentCount
        - highRiskCount
        - mediumRiskCount
        - lowRiskCount
        - averageRiskProbability
        - weakSkills
        - activityTrend
        - students
        - period
        - activeStudentCount
        - answerCount
        - averageCorrectRate
        - behaviorDistribution
        - activityHeatmap
        - studentScatter
      properties:
        trace:
          $ref: '#/components/schemas/TraceRef'
          x-edutwin-visibility: internal
        courseId:
          type: string
          format: uuid
        generatedAt:
          type: string
          format: date-time
        studentCount:
          type: integer
          minimum: 0
        highRiskCount:
          type: integer
          minimum: 0
        mediumRiskCount:
          type: integer
          minimum: 0
        lowRiskCount:
          type: integer
          minimum: 0
        averageRiskProbability:
          type: number
          minimum: 0
          maximum: 1
        period: { type: string, enum: [7D, 30D, TERM] }
        activeStudentCount: { type: integer, minimum: 0 }
        answerCount: { type: integer, minimum: 0 }
        averageCorrectRate: { type: number, minimum: 0, maximum: 1 }
        weakSkills:
          type: array
          items:
            $ref: '#/components/schemas/WeakSkill'
        activityTrend:
          type: array
          items:
            $ref: '#/components/schemas/ActivityPoint'
        students:
          type: array
          items:
            $ref: '#/components/schemas/StudentRiskSummary'
        behaviorDistribution:
          type: array
          items: { $ref: '#/components/schemas/BehaviorDistributionItem' }
        activityHeatmap:
          type: array
          items: { $ref: '#/components/schemas/ActivityHeatmapPoint' }
        studentScatter:
          type: array
          items: { $ref: '#/components/schemas/StudentScatterPoint' }
    StudentAnalytics:
      type: object
      additionalProperties: false
