openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: EduTwin Public API
  version: 2.0.0
  license:
    name: Course demonstration use
    identifier: LicenseRef-Course-Demonstration
  description: |
    EduTwin browser-facing contract. MySQL is the system of record. Redis values,
    task state, and server-sent events are recoverable projections. Every traced
    response identifies the accepted answer event, analysis job, preallocated or
    persisted snapshot, data versions, and requested and effective model versions.
    Authentication uses a stateless JWT with one active role and all granted roles.
    Role, password, and account changes advance the token version and invalidate older
    tokens. Logout consists of discarding the JWT in the browser.
servers:
  - url: http://127.0.0.1:8080
    description: Local Compose deployment
tags:
  - name: Authentication
    description: Role authentication and current-principal discovery.
  - name: Role Sessions
    description: Active-role switching without resubmitting credentials.
  - name: Profile and Notifications
    description: Self-service profile fields and in-app notifications.
  - name: Assistant
    description: Role-isolated persistent read-only assistant conversations and SSE events.
  - name: Courses
    description: Role-scoped course discovery.
  - name: Teacher Dashboard
    description: Aggregated risk, mastery, and activity views for assigned courses.
  - name: Student Twin
    description: Current and historical immutable student twin snapshots.
  - name: Practice
    description: Rule-selected questions and asynchronous answer acceptance.
  - name: Analysis Jobs
    description: Durable analysis state and resumable completion events.
  - name: Learning Plans
    description: Versioned plans whose task facts are produced by rules.
  - name: Diagnosis
    description: Structured evidence-bound AI diagnosis with template fallback.
  - name: Counselor
    description: Counselor-scoped student and class comparison views.
  - name: Risk Interventions
    description: Teacher and counselor risk-case workflows plus student action feedback.
  - name: Transparency
    description: Data provenance, model selection metrics, and artifact hashes.
  - name: Administration
    description: User, organization, academic-term, governance, and audit administration.
  - name: Teacher LMS
    description: Teacher-owned course, content, roster, assessment, and grade management.
  - name: Student LMS
    description: Published course content, lesson progress, assessment submission, and grades.
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Authenticate a teacher or student
      description: Returns a short-lived JWT and the role-scoped course identifiers.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Return the authenticated principal
      responses:
        '200':
          description: Current principal and authorized courses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthenticatedUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/password:
    post:
      tags: [Authentication]
      operationId: changePassword
      summary: Change the authenticated account password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204': { description: Password changed; the current token must be discarded. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/auth/role:
    post:
      tags: [Role Sessions]
      operationId: switchActiveRole
      summary: Switch the account's active role and issue a replacement token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/UserRole' }
      responses:
        '200': { description: Replacement role session., content: { application/json: { schema: { $ref: '#/components/schemas/AuthSession' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/me/profile:
    get:
      tags: [Profile and Notifications]
      operationId: getMyProfile
      summary: Return official identity, organizations, roles, and editable profile fields
      responses:
        '200': { description: Current profile., content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Profile and Notifications]
      operationId: updateMyProfile
      summary: Update contact details, preset avatar, and theme color
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/UserProfileUpdate' } } }
      responses:
        '200': { description: Updated profile., content: { application/json: { schema: { $ref: '#/components/schemas/UserProfile' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/v1/notifications:
    get:
      tags: [Profile and Notifications]
      operationId: listMyNotifications
      summary: List the current user's in-app notifications
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200': { description: Paged notifications., content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPage' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/unread-count:
    get:
      tags: [Profile and Notifications]
      operationId: getUnreadNotificationCount
      summary: Return the current user's unread notification count
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, format: int64, minimum: 0 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/notifications/{notificationId}/read:
    put:
      tags: [Profile and Notifications]
      operationId: markNotificationRead
      summary: Mark one owned notification as read
      parameters:
        - { name: notificationId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Notification marked read. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/notifications/read-all:
    put:
      tags: [Profile and Notifications]
      operationId: markAllNotificationsRead
      summary: Mark all owned notifications as read
      responses:
        '204': { description: All notifications marked read. }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/assistant/conversations:
    get:
      tags: [Assistant]
      operationId: listAssistantConversations
      summary: List conversations owned by the current user and active role
      responses:
        '200': { description: Role-isolated conversations., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantConversationList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Assistant]
      operationId: createAssistantConversation
      summary: Create a conversation for the current active role
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: { title: { type: string, maxLength: 120 } }
      responses:
        '201': { description: Conversation created., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantConversation' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/assistant/conversations/{conversationId}:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      tags: [Assistant]
      operationId: renameAssistantConversation
      summary: Rename an owned role-isolated conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties: { title: { type: string, minLength: 1, maxLength: 120 } }
      responses:
        '200': { description: Conversation renamed., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantConversation' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Assistant]
      operationId: deleteAssistantConversation
      summary: Remove message bodies while retaining body-free audit metadata
      responses:
        '204': { description: Conversation deleted. }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/assistant/conversations/{conversationId}/messages:
    parameters:
      - { name: conversationId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Assistant]
      operationId: listAssistantMessages
      summary: List messages in an owned role-isolated conversation
      responses:
        '200': { description: Conversation messages., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessageList' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Assistant]
      operationId: sendAssistantMessage
      summary: Persist a message and start read-only tool-backed generation
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/AssistantSendRequest' } } }
      responses:
        '202': { description: Generation started., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessageReceipt' } } } }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/assistant/messages/{messageId}/retry:
    post:
      tags: [Assistant]
      operationId: retryAssistantMessage
      summary: Retry an owned failed assistant message
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '202': { description: Retry started., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessageReceipt' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/assistant/messages/{messageId}:
    get:
      tags: [Assistant]
      operationId: getAssistantMessage
      summary: Read one persisted assistant message for stream recovery
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Persisted message state., content: { application/json: { schema: { $ref: '#/components/schemas/AssistantMessage' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/assistant/messages/{messageId}/events:
    get:
      tags: [Assistant]
      operationId: streamAssistantMessageEvents
      summary: Stream persisted and live events for an owned assistant message
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: Last-Event-ID, in: header, required: false, schema: { type: integer, format: int64, minimum: 0 } }
      responses:
        '200':
          description: Persisted and live assistant SSE events.
          content:
            text/event-stream:
              schema: { $ref: '#/components/schemas/AssistantEvent' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/courses:
    get:
      tags: [Courses]
      operationId: listAccessibleCourses
      summary: List role-scoped courses
      description: Students receive enrolled courses; teachers receive assigned courses.
      responses:
        '200':
          description: Accessible courses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/teacher/courses/{courseId}/dashboard:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/AnalyticsPeriod'
    get:
      tags: [Teacher Dashboard]
      operationId: getTeacherDashboard
      summary: Return the teacher course dashboard
      description: Access is restricted to teachers assigned to the requested course.
      x-rbac: [TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200':
          description: Current course risk and learning aggregates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherDashboard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/student/courses/{courseId}/analytics:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/AnalyticsPeriod'
    get:
      tags: [Student Twin]
      operationId: getStudentAnalytics
      summary: Return self-service learning trends and behavior analytics
      x-rbac: [STUDENT_SELF]
      responses:
        '200':
          description: Student learning analytics for the selected period.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentAnalytics'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/courses/{courseId}/students/{studentId}/twin/current:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Student Twin]
      operationId: getCurrentTwin
      summary: Return the current immutable twin snapshot
      description: Students may read only their own twin; teachers may read enrolled students in assigned courses.
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200':
          description: Current twin state, read from MySQL or a validated Redis projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwinState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courses/{courseId}/students/{studentId}/twin/history:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
      - $ref: '#/components/parameters/BeforeVersion'
      - $ref: '#/components/parameters/Limit'
    get:
      tags: [Student Twin]
      operationId: getTwinHistory
      summary: Return immutable twin snapshot history
      description: Results are ordered by snapshotVersion descending.
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200':
          description: Snapshot history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwinHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courses/{courseId}/practice/next:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Practice]
      operationId: getNextPracticeQuestion
      summary: Return the next rule-selected practice question
      description: Access is restricted to the authenticated student's enrollment.
      x-rbac: [STUDENT_SELF]
      responses:
        '200':
          description: Next question and the twin trace used for selection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PracticeQuestion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courses/{courseId}/answers:
    parameters:
      - $ref: '#/components/parameters/CourseId'
    get:
      tags: [Practice]
      operationId: listAnswerHistory
      summary: Return the authenticated student's course answer history
      description: Results are ordered by eventSequence descending and include online and imported answer events.
      x-rbac: [STUDENT_SELF]
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: Paged answer history for the authenticated student and course.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnswerHistoryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Practice]
      operationId: submitAnswer
      summary: Accept an answer for asynchronous analysis
      description: |
        The transaction writes the answer event, a QUEUED analysis job with a
        preallocated snapshot identifier, and an outbox event. The response does
        not wait for FastAPI, Redis consumption, or the configured LLM. Replaying the same
        key and canonical request returns the original job. Reusing the key with a
        different request returns 409.
      x-rbac: [STUDENT_SELF]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerSubmission'
      responses:
        '202':
          description: Answer persisted and analysis queued.
          headers:
            Location:
              required: true
              description: Relative URL of the analysis job.
              schema:
                type: string
            Retry-After:
              required: true
              description: Suggested polling delay in seconds.
              schema:
                type: integer
                minimum: 1
            Idempotency-Replayed:
              required: true
              description: Indicates that the original response was replayed.
              schema:
                type: boolean
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/analysis/jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Analysis Jobs]
      operationId: getAnalysisJob
      summary: Return durable analysis job state
      description: Students may access their jobs; teachers may access jobs in assigned courses.
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200':
          description: Current durable job state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/analysis/jobs/{jobId}/events:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/LastEventId'
    get:
      tags: [Analysis Jobs]
      operationId: streamAnalysisJob
      summary: Stream durable analysis progress
      description: |
        Each event uses the persisted per-job sequence as the SSE id. A reconnect
        with Last-Event-ID replays later durable events and then continues live.
        Authorization is identical to the job resource.
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200':
          description: Server-sent job events ending in job.completed or job.failed.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                const: no-cache
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/SseJobEvent'
              x-sse-data-only: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courses/{courseId}/students/{studentId}/learning-plans/current:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Learning Plans]
      operationId: getCurrentLearningPlan
      summary: Return the current rule-generated learning plan
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200':
          description: Current learning plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/courses/{courseId}/students/{studentId}/learning-plans:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
    post:
      tags: [Learning Plans]
      operationId: generateLearningPlan
      summary: Generate a new rule-based plan version
      description: |
        The configured LLM cannot choose, remove, reorder, or mutate plan task facts. Plan
        item progress is advanced only by accepted answer events in the analysis
        workflow; this resource does not accept manual item-state mutation.
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanGenerationRequest'
      responses:
        '201':
          description: New immutable plan version.
          headers:
            Location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningPlan'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/courses/{courseId}/students/{studentId}/learning-plans/current/lifecycle:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
    get:
      tags: [Learning Plans]
      operationId: getCurrentLearningPlanLifecycle
      summary: Return the current plan and mutable task lifecycle projection
      x-rbac: [STUDENT_SELF, TEACHER_ASSIGNED_TO_COURSE]
      responses:
        '200': { description: Current plan lifecycle., content: { application/json: { schema: { $ref: '#/components/schemas/PlanLifecycle' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/courses/{courseId}/students/{studentId}/learning-plans/current/tasks/{taskId}/start:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Learning Plans]
      operationId: startCurrentLearningPlanTask
      summary: Optimistically start a pending task in the current plan
      x-rbac: [STUDENT_SELF]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/StartPlanTaskRequest' } } }
      responses:
        '200': { description: Updated plan lifecycle., content: { application/json: { schema: { $ref: '#/components/schemas/PlanLifecycle' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/v1/courses/{courseId}/students/{studentId}/learning-plans/current/tasks/{taskId}/skip:
    parameters:
      - $ref: '#/components/parameters/CourseId'
      - $ref: '#/components/parameters/StudentId'
      - { name: taskId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Learning Plans]
      operationId: skipCurrentLearningPlanTask
      summary: Optimistically skip a pending or in-progress task
      x-rbac: [STUDENT_SELF]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/SkipPlanTaskRequest' } } }
      responses:
        '200': { description: Updated plan lifecycle., content: { application/json: { schema: { $ref: '#/components/schemas/PlanLifecycle' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
