name: edutwin-test

services:
  mysql-test:
    image: mysql:8.4.5
    platform: linux/amd64
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --transaction-isolation=READ-COMMITTED
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_DATABASE: edutwin_test
      MYSQL_USER: edutwin
      MYSQL_PASSWORD: edutwin-local
      MYSQL_ROOT_PASSWORD: edutwin-test-root
      TZ: UTC
    ports:
      - 127.0.0.1:33306:3306
    tmpfs:
      - /var/lib/mysql:size=1g,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot --password="$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 2s
      timeout: 3s
      start_period: 20s
      retries: 30

  redis-test:
    image: redis:7.4.5-alpine
    platform: linux/amd64
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
    ports:
      - 127.0.0.1:36379:6379
    tmpfs:
      - /data:size=128m,mode=1777
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 2s
      timeout: 2s
      retries: 20
