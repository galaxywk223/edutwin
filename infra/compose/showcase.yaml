name: edutwin-showcase

services:
  showcase-api:
    build:
      context: ../..
      dockerfile: infra/showcase-api/Dockerfile
    environment:
      EDUTWIN_DEMO_PROFILE: showcase
      EDUTWIN_MODEL_ENABLED: "false"
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      start_period: 3s
      retries: 10

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_EDUTWIN_DEMO_PROFILE: showcase
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 10

  gateway:
    image: caddy:2.10.0-alpine
    ports:
      - "127.0.0.1:${EDUTWIN_SHOWCASE_PORT:-8080}:8080"
    volumes:
      - ../caddy/Caddyfile.showcase:/etc/caddy/Caddyfile:ro
    depends_on:
      showcase-api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 2s
      start_period: 3s
      retries: 10
