[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[project]
name = "edutwin-modeling"
version = "1.0.0"
description = "Reproducible EduTwin data, training, evaluation, registry, and inference service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "catboost==1.2.10",
  "duckdb==1.5.5",
  "fastapi==0.140.13",
  "httpx==0.28.1",
  "joblib==1.5.3",
  "lightgbm==4.7.0",
  "numpy==2.4.6",
  "orjson==3.11.9",
  "pandas==3.0.5",
  "pyarrow==25.0.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.0",
  "scipy==1.17.1",
  "shap==0.51.0",
  "torch==2.13.0",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
dev = [
  "mypy==2.3.0",
  "pandas-stubs==3.0.3.260530",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.0",
  "types-PyYAML==6.0.12.20260724",
]

[project.scripts]
edutwin-modeling = "edutwin_modeling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edutwin_modeling"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["catboost.*", "joblib.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "edutwin_modeling.knowledge.metrics",
  "edutwin_modeling.knowledge.neural",
  "edutwin_modeling.knowledge.statistical",
  "edutwin_modeling.risk.model",
  "edutwin_modeling.risk.pipeline",
]
warn_return_any = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["edutwin_modeling"]
