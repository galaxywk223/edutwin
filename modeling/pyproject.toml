[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "edutwin-modeling"
version = "1.0.0"
description = "Reproducible EduTwin data, training, evaluation, registry, and inference service"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "catboost==1.2.8",
  "duckdb==1.3.2",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "joblib==1.5.1",
  "lightgbm==4.6.0",
  "numpy==1.26.4",
  "orjson==3.11.0",
  "pandas==2.3.1",
  "pyarrow==20.0.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "PyYAML==6.0.2",
  "scikit-learn==1.7.1",
  "scipy==1.16.0",
  "shap==0.48.0",
  "torch==2.7.1",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.16.1",
  "pandas-stubs==2.3.0.250703",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.3",
  "types-PyYAML==6.0.12.20250516",
]

[project.scripts]
edutwin-modeling = "edutwin_modeling.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edutwin_modeling"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_generics = false
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["catboost.*", "joblib.*", "sklearn.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "edutwin_modeling.knowledge.metrics",
  "edutwin_modeling.knowledge.neural",
  "edutwin_modeling.knowledge.statistical",
  "edutwin_modeling.risk.model",
  "edutwin_modeling.risk.pipeline",
]
warn_return_any = false
disallow_untyped_calls = false

[tool.coverage.run]
branch = true
source = ["edutwin_modeling"]
