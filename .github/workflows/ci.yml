name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:showcase

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Start backend test dependencies
        run: docker compose -f infra/compose/test-dependencies.yaml up -d --wait --wait-timeout 120
      - run: bash ./backend/mvnw -B -ntp -f backend/pom.xml test
      - name: Stop backend test dependencies
        if: always()
        run: docker compose -f infra/compose/test-dependencies.yaml down --volumes --remove-orphans

  modeling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: modeling/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './modeling[dev]'
      - run: ruff check modeling
      - run: mypy --config-file modeling/pyproject.toml modeling/src
      - run: pytest modeling/tests

  contracts-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Verify contracts
        shell: pwsh
        run: ./scripts/check/verify-contracts.ps1
      - name: Validate research Compose
        run: docker compose --env-file infra/env/.env.example -f infra/compose/compose.yaml config --quiet
      - name: Validate showcase Compose
        run: docker compose -f infra/compose/showcase.yaml config --quiet
      - name: Validate showcase API
        run: node --check infra/showcase-api/server.mjs
